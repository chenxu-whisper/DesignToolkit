name: designtoolkit

x-app-environment: &app-environment
  DESIGNTOOLKIT_DATA_DIR: /data
  DESIGNTOOLKIT_HOSTED: "1"
  DESIGNTOOLKIT_API_REQUESTS_PER_MINUTE: "${DESIGNTOOLKIT_API_REQUESTS_PER_MINUTE:-120}"
  DESIGNTOOLKIT_MAX_IMAGE_PIXELS: "${DESIGNTOOLKIT_MAX_IMAGE_PIXELS:-100000000}"
  DESIGNTOOLKIT_MAX_OUTPUT_BYTES: "${DESIGNTOOLKIT_MAX_OUTPUT_BYTES:-5368709120}"
  DESIGNTOOLKIT_MAX_PREVIEW_CONCURRENCY: "${DESIGNTOOLKIT_MAX_PREVIEW_CONCURRENCY:-2}"
  DESIGNTOOLKIT_MAX_QUEUED_TASKS: "${DESIGNTOOLKIT_MAX_QUEUED_TASKS:-20}"
  DESIGNTOOLKIT_MAX_SESSION_BYTES: "${DESIGNTOOLKIT_MAX_SESSION_BYTES:-2147483648}"
  DESIGNTOOLKIT_MAX_UPLOAD_BYTES: "${DESIGNTOOLKIT_MAX_UPLOAD_BYTES:-524288000}"
  DESIGNTOOLKIT_MAX_UPLOAD_CONCURRENCY: "${DESIGNTOOLKIT_MAX_UPLOAD_CONCURRENCY:-4}"
  DESIGNTOOLKIT_MAX_VIDEO_DURATION_SECONDS: "${DESIGNTOOLKIT_MAX_VIDEO_DURATION_SECONDS:-1800}"
  DESIGNTOOLKIT_MAX_VIDEO_HEIGHT: "${DESIGNTOOLKIT_MAX_VIDEO_HEIGHT:-2160}"
  DESIGNTOOLKIT_MAX_VIDEO_WIDTH: "${DESIGNTOOLKIT_MAX_VIDEO_WIDTH:-3840}"
  DESIGNTOOLKIT_MIN_FREE_BYTES: "${DESIGNTOOLKIT_MIN_FREE_BYTES:-5368709120}"
  DESIGNTOOLKIT_RETENTION_SECONDS: "${DESIGNTOOLKIT_RETENTION_SECONDS:-7200}"
  DESIGNTOOLKIT_SECURE_COOKIES: "1"
  DESIGNTOOLKIT_UPLOAD_REQUESTS_PER_HOUR: "${DESIGNTOOLKIT_UPLOAD_REQUESTS_PER_HOUR:-30}"
  REDIS_URL: redis://redis:6379/0

x-worker: &worker
  image: designtoolkit:latest
  pull_policy: never
  cpus: "${WORKER_CPUS:-3.0}"
  mem_limit: "${WORKER_MEMORY:-5g}"
  pids_limit: "${WORKER_PIDS:-256}"
  init: true
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  environment: *app-environment
  volumes:
    - app_data:/data
  security_opt:
    - no-new-privileges:true

services:
  redis:
    image: redis:8.2-alpine
    cpus: "${REDIS_CPUS:-0.5}"
    mem_limit: "${REDIS_MEMORY:-512m}"
    pids_limit: "${REDIS_PIDS:-128}"
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_HOSTED_MODE: "true"
    image: designtoolkit:latest
    cpus: "${APP_CPUS:-1.0}"
    mem_limit: "${APP_MEMORY:-1536m}"
    pids_limit: "${APP_PIDS:-256}"
    init: true
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *app-environment
    expose:
      - "8765"
    volumes:
      - app_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  worker-1:
    <<: *worker
    command: rq worker designtoolkit --url redis://redis:6379/0

  worker-2:
    <<: *worker
    command: rq worker designtoolkit --url redis://redis:6379/0

  cleanup:
    <<: *worker
    cpus: "${CLEANUP_CPUS:-0.25}"
    mem_limit: "${CLEANUP_MEMORY:-256m}"
    pids_limit: "${CLEANUP_PIDS:-128}"
    command: python -m designtoolkit.web.cleanup --interval 60

  caddy:
    image: caddy:2.10-alpine
    cpus: "${CADDY_CPUS:-0.25}"
    mem_limit: "${CADDY_MEMORY:-256m}"
    pids_limit: "${CADDY_PIDS:-128}"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  app_data:
  caddy_data:
  caddy_config:
  redis_data:
