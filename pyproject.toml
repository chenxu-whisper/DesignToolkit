[project]
name = "designtoolkit"
version = "0.1.0"
description = "A uv-managed CLI application for design tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "redis>=5.2",
    "rq>=2.1",
    "uvicorn>=0.35.0",
]

[project.scripts]
designtoolkit = "designtoolkit.main:main"

[dependency-groups]
dev = [
  "fakeredis>=2.26",
  "httpx>=0.28.0",
  "pytest>=8.4.1",
  "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.temp/pytest-tmp"
cache_dir = ".temp/pytest/cache"

[tool.ruff]
cache-dir = ".temp/ruff/cache"
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
