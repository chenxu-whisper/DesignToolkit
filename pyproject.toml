[project]
name = "designtoolkit"
version = "0.1.0"
description = "A uv-managed CLI application for design tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
designtoolkit = "designtoolkit.main:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
